name: Migrate Stock Analyzer

on:
  push:
    paths:
      - '.github/workflows/migrate-stock-analyzer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dedicated repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy analyzer from source branch
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch stock-analyzer-v0.1 https://github.com/balavikraman/ai-swing-trading-india.git /tmp/source
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude '.runtime/' \
            --exclude '.pytest_cache/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            --exclude '*.db' \
            /tmp/source/stock-analyzer/ ./
          rm -rf .pytest_cache .runtime
          find . -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find . -type f -name '*.pyc' -delete || true

      - name: Commit migrated application
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git commit -m 'Migrate Stock Analyzer V0.3 into dedicated repository'
          git push origin HEAD:main
